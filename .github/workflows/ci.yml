# AI-Doc — CI Pipeline
#
# Runs on every push and on every PR targeting main.
# A PR cannot merge unless all jobs pass (enforced by branch protection on main).
#
# Jobs (fail-fast sequence):
#   lint   → ruff (backend) + ESLint (frontend)
#   test   → pytest (backend) + vitest (frontend), with PostgreSQL + Redis services
#   build  → docker build for both backend and frontend
#   schema → sqlfluff lint on schema/schema.sql

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 — Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.7.4

      - name: Lint backend
        run: ruff check backend/

      - name: Check backend formatting
        run: ruff format --check backend/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Job 2 — Test
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ai_doc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ai_doc_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-used-in-production
      GOOGLE_OAUTH_CLIENT_ID: ci-placeholder
      GOOGLE_OAUTH_CLIENT_SECRET: ci-placeholder
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Apply database schema
        run: |
          PGPASSWORD=test_password psql \
            -h localhost -p 5432 \
            -U test_user -d ai_doc_test \
            -f schema/schema.sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest --tb=short -q
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Job 3 — Build
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.dev -t ai-doc-api:ci .
        working-directory: backend

      - name: Build frontend image
        run: docker build -f Dockerfile.dev -t ai-doc-frontend:ci .
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Job 4 — Schema validation
  # ---------------------------------------------------------------------------
  schema:
    name: Validate SQL schema
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Lint schema.sql
        run: sqlfluff lint schema/schema.sql --dialect postgres
